<style>
:root{
  --bg:#10262b; --bg2:#16323a; --line:#274952;
  --accent:#d98244; --accent-dk:#b8652c;
  --card:#f3ecdf; --ink:#1b2a2e; --ink-soft:#5c6b6e;
  --known:#63a879; --almost:#3fb0a8; --important:#dd6a5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#e8e2d6;
  font-family:"Segoe UI",Roboto,"Noto Sans",system-ui,-apple-system,Arial,sans-serif;}
body{padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 14px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0;font-weight:700;letter-spacing:.2px}
h1 em{font-style:italic;color:var(--accent);font-weight:700}
#counter{font-size:14px;color:#9fb3b7;white-space:nowrap}
.piles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.pile{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:11px 12px;
  text-align:left;cursor:pointer;color:inherit;font:inherit}
.pile .num{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1}
.pile .lbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#93a8ac;margin-top:5px}
.pile[data-p="live"] .num{color:var(--accent)}
.pile[data-p="known"] .num{color:var(--known)}
.pile[data-p="almost"] .num{color:var(--almost)}
.pile[data-p="important"] .num{color:var(--important)}
.pile.sel{border-color:var(--accent);background:#1b3b44}
.pile[data-p="known"].sel{border-color:var(--known)}
.pile[data-p="almost"].sel{border-color:var(--almost)}
.pile[data-p="important"].sel{border-color:var(--important)}
.card{background:var(--card);color:var(--ink);border-radius:12px;padding:20px 18px;min-height:320px}
.qnum{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px}
.instr{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin-bottom:12px}
.qtext{font-size:21px;line-height:1.45;font-weight:700;margin:0 0 16px}
.opts{list-style:none;margin:0;padding:0}
.opt{display:flex;gap:11px;padding:11px 8px;border-bottom:1px solid #ded4c2;
  font-size:16px;line-height:1.45;cursor:pointer;border-radius:6px}
.opt:last-child{border-bottom:0}
.opt .k{color:var(--accent-dk);font-weight:700;min-width:20px}
.opt.correct{background:#dbeedf}
.opt.correct .k{color:#2f7a4a}
.opt.wrong{background:#f7dcd8}
.opt.wrong .k{color:#b33f30}
.opt.locked{cursor:default}
.body{font-size:16px;line-height:1.55}
.body p{margin:0 0 12px;white-space:pre-wrap}
.body ol.items{margin:0;padding:0;list-style:none}
.body ol.items li{padding:8px 0;border-bottom:1px solid #ded4c2}
.body ol.items li:last-child{border-bottom:0}
table.match{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
table.match th{background:#e2d8c5;text-align:left;font-size:12px;letter-spacing:.6px;padding:8px}
table.match td{border:1px solid #d5cab6;padding:8px;vertical-align:top}
.answer{margin-top:16px;padding:13px 14px;background:#dfeaea;border-left:4px solid var(--accent);
  border-radius:6px;font-size:17px;line-height:1.5;white-space:pre-wrap}
.answer b{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:5px;font-weight:700}
.verdict{margin-top:14px;font-size:15px;font-weight:700}
.verdict.ok{color:#2f7a4a}
.verdict.no{color:#b33f30}
button{font:inherit;cursor:pointer;border:none}
#show{width:100%;margin-top:14px;background:var(--accent);color:#221008;font-weight:700;
  font-size:17px;padding:15px;border-radius:10px}
#show:active{background:var(--accent-dk)}
.sorts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.sort{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:11px 6px;
  color:#e8e2d6;text-align:center;line-height:1.25}
.sort .t{font-weight:700;font-size:15px}
.sort .s{font-size:11.5px;color:#93a8ac;margin-top:2px}
.sort[data-p="live"] .t{color:var(--accent)}
.sort[data-p="known"] .t{color:var(--known)}
.sort[data-p="almost"] .t{color:var(--almost)}
.sort[data-p="important"] .t{color:var(--important)}
.sort.here{border-color:var(--accent)}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.nav button{background:var(--bg2);border:1px solid var(--line);color:#cfe0e2;
  padding:11px 18px;border-radius:9px;font-size:15px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;
  font-size:12.5px;color:#7f9498}
footer .acts{display:flex;gap:14px}
footer .acts button{background:none;color:#9fb3b7;text-decoration:underline;padding:4px 0;font-size:12.5px}
#restore-file{display:none}
.empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:17px;line-height:1.6}
.hide{display:none !important}
.goto{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#93a8ac;flex-wrap:wrap}
.goto input{width:72px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:#cfe0e2;font:inherit;font-size:15px;text-align:center}
.goto button{padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#221008;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
#gotoMsg{flex-basis:100%;min-height:16px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Greek Institutions <em>P.E.G.P.</em></h1>
  <div id="counter">0 / 0</div>
</header>

<div class="piles">
  <button class="pile" data-p="live"><div class="num" id="n-live">80</div><div class="lbl">Live</div></button>
  <button class="pile" data-p="known"><div class="num" id="n-known">0</div><div class="lbl">Known</div></button>
  <button class="pile" data-p="almost"><div class="num" id="n-almost">0</div><div class="lbl">Almost</div></button>
  <button class="pile" data-p="important"><div class="num" id="n-important">0</div><div class="lbl">Important</div></button>
</div>

<div class="card" id="card"></div>

<button id="show">Show answer</button>

<div class="sorts">
  <button class="sort" data-p="live"><div class="t">Live</div><div class="s">see again</div></button>
  <button class="sort" data-p="known"><div class="t">Known</div><div class="s">I know it</div></button>
  <button class="sort" data-p="almost"><div class="t">Almost</div><div class="s">nearly there</div></button>
  <button class="sort" data-p="important"><div class="t">Important</div><div class="s">needs work</div></button>
</div>

<div class="nav">
  <button id="back">&larr; Back</button>
  <button id="shuffle">Shuffle</button>
  <button id="next">Next &rarr;</button>
</div>

<div class="goto"><label for="gotoN">Go to question</label><input id="gotoN" type="number" inputmode="numeric" min="1" max="80" placeholder="1–80"><button id="gotoBtn" type="button">Go</button><span id="gotoMsg"></span></div>
<footer>
  <span>80 questions &middot; November 2026</span>
  <span class="acts">
    <button id="backup">Backup</button>
    <button id="restore">Restore</button>
    <button id="reset">Reset piles</button>
  </span>
  <input type="file" id="restore-file" accept="application/json,.json">
</footer>

<script>

υ υπάρχει συντρέχουσα αρμοδιότητα ΕΕ και κρατών μελών αποφασίζονται:","options":{"Α":"Από τις Βρυξέλλες","Β":"Από ισχυρά κράτη μέλη της ΕΕ όπως η Γαλλία και η Γερμανία","Γ":"Από το Ευρωπαϊκό Κοινοβούλιο","Δ":"Με μια διαδικασία που απαιτεί την από κοινού απόφαση της Ευρωπαϊκής Επιτροπής, του Συμβουλίου της ΕΕ και του Ευρωπαϊκού Κοινοβουλίου (συνήθης νομοθετική διαδικασία)"},"answer":"Δ"},{"n":39,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: τον Πρόεδρο της Δημοκρατίας, την Κυβέρνηση, τον Πρόεδρο της Δημοκρατίας, τη Βουλή","q":"","text":"Στην Ελλάδα, η νομοθετική λειτουργία ασκείται από (1) ________________ και (2) ________________. H εκτελεστική λειτουργία ασκείται από (3) _______________ και (4) ______________.","answer":"(1) τη Βουλή\n(2) τον Πρόεδρο της Δημοκρατίας\n(3) τον Πρόεδρο της Δημοκρατίας\n(4) την Κυβέρνηση"},{"n":40,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: πέντε, ελληνική καταγωγή, έξι, την ιδιότητα του Έλληνα πολίτη","q":"","text":"Για να εκλεγεί κάποιος Πρόεδρος της Δημοκρατίας, θα πρέπει να έχει (1) ___________ για τουλάχιστον (2) ___________ χρόνια. Επίσης, θα πρέπει να έχει από πατέρα ή μητέρα (3) ___________, να είναι τουλάχιστον 40 ετών και να έχει τη νόμιμη ικανότητα του εκλέγειν. Η διαδικασία εκλογής νέου Προέδρου της Δημοκρατίας, σε περίπτωση που ο εν ενεργεία Πρόεδρος αδυνατεί να ασκήσει τα καθήκοντά του για πάνω από 30 ημέρες, σε καμία περίπτωση δεν μπορεί να καθυστερήσει περισσότερο από (4) ___________ συνολικά μήνες, αφότου άρχισε η διαδικασία αναπλήρωσής του.","answer":"(1) την ιδιότητα του Έλληνα πολίτη\n(2) πέντε\n(3) ελληνική καταγωγή\n(4) έξι"},{"n":41,"type":"mcq","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).","q":"Ο σκοπός του Συνηγόρου του Πολίτη είναι:","options":{"Α":"Να παρέχει δικαστική συνδρομή στους πολίτες","Β":"Να εκπροσωπεί τους Έλληνες πολίτες στο Ευρωπαϊκό δικαστήριο","Γ":"Να διαμεσολαβεί μεταξύ των πολιτών και της διοίκησης σε περίπτωση διάκρισης εις βάρος τους ή κακοδιοίκησης","Δ":"Κανένα από τα παραπάνω"},"answer":"Γ"},{"n":42,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: το Προεδρικό Διάταγμα, ο νόμος, το Σύνταγμα, οι ιδρυτικές συνθήκες της Ευρωπαϊκής Ένωσης","q":"","text":"Στην Ελλάδα, (1) __________ υπερισχύει έναντι όλων των εθνικών νομικών πράξεων. Στο ίδιο τυπικό επίπεδο με αυτό ωστόσο κατατάσσεται/ονται και (2) __________ της Ευρωπαϊκής Ένωσης. Ακολουθούν οι διεθνείς νομικές πράξεις που έχουν αναγνωριστεί από το ελληνικό κράτος, (3) __________, (4) __________ και οι διοικητικές πράξεις.","answer":"(1) το Σύνταγμα\n(2) οι ιδρυτικές συνθήκες της Ευρωπαϊκής Ένωσης\n(3) ο νόμος\n(4) το Προεδρικό Διάταγμα"},{"n":43,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: επίκαιρες επερωτήσεις, επερωτήσεις, πρόταση δυσπιστίας, ερωτήσεις","q":"","text":"Α. Ο κοινοβουλευτικός έλεγχος στην Ελλάδα ασκείται κυρίως αλλά όχι αποκλειστικά με (1) __________, (2) __________ και με (3) __________.\n\nΒ. H Boυλή μπορεί με απόφασή της να αποσύρει την εμπιστοσύνη της από την Kυβέρνηση ή από μέλoς της ύστερα από (4) __________.","answer":"(1) ερωτήσεις\n(2) επίκαιρες επερωτήσεις\n(3) επερωτήσεις\n(4) πρόταση δυσπιστίας"},{"n":44,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: έκπτωση, δήλωση αποποίησης, τη γέννηση σε ελληνικό έδαφος υπό προϋποθέσεις, τη συγγένεια.","q":"","text":"Η απώλεια της Ελληνικής ιθαγένειας γίνεται, κυρίως, στις εξής περιπτώσεις: με (1) __________ και (2) __________. Αντίθετα, την Ελληνική ιθαγένεια μπορεί να αποκτήσει κάποιος από γέννηση, με βάση (3) __________ εξ αίματος και (4) __________.","answer":"(1) έκπτωση\n(2) δήλωση αποποίησης\n(3) τη συγγένεια\n(4) τη γέννηση σε ελληνικό έδαφος υπό προϋποθέσεις"},{"n":45,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: Υπουργός, τον/την Πρόεδρο της Βουλής, τον/την Πρόεδρο της Δημοκρατίας, Βουλευτής","q":"Σύμφωνα με τον Κανονισμό της Βουλής:","text":"Κάθε βουλευτής μπορεί οποτεδήποτε να παραιτηθεί από το βουλευτικό αξίωμα. Την παραίτησή του την υποβάλλει γραπτώς προς (1) __________ .\n\nΚάποιο μέλος του Προεδρείου της Βουλής δεν μπορεί να είναι ταυτόχρονα και (2) __________ . Υπάρχει ασυμβίβαστο.\n\nΗ κήρυξη της έναρξης των εργασιών της βουλευτικής περιόδου γίνεται από (3) __________ αυτοπροσώπως ή δια του Πρωθυπουργού.\n\nΣτην Ολομέλεια της Βουλής μπορεί να συμμετέχει κάθε (4) __________.","answer":"(1) τον/την Πρόεδρο της Βουλής\n(2) Υπουργός\n(3) τον/την Πρόεδρο της Δημοκρατίας\n(4) Βουλευτής"},{"n":46,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: Η Γενική Διεύθυνση Προστασίας Καταναλωτή, Η Επιτροπή Ανταγωνισμού, Η Ρυθμιστική Αρχή Ενέργειας, Ο Συνήγορος του Καταναλωτή","q":"","text":"(1) _______________ αναλαμβάνει δωρεάν διαμεσολάβηση για τη φιλική διευθέτηση διαφορών των καταναλωτών ή των ενώσεών τους με προμηθευτές του δημόσιου ή του ιδιωτικού τομέα.\n\n(2) _______________ έχει την ευθύνη για την καταπολέμηση των πρακτικών που περιορίζουν ή νοθεύουν τον ανταγωνισμό και καταλήγουν σε βλάβη των καταναλωτών.\n\n(3) _______________ εποπτεύει τον βαθμό και την αποτελεσματικότητα του ανταγωνισμού στην εγχώρια αγορά ενέργειας και τις τιμές για τους οικιακούς καταναλωτές.\n\n(4) _______________ του Υπουργείου Ανάπτυξης έχει την ευθύνη για την προστασία των οφειλετών από αθέμιτες πρακτικές είσπραξης των απαιτήσεων.","answer":"(1) Ο Συνήγορος του Καταναλωτή\n(2) Η Επιτροπή Ανταγωνισμού\n(3) Η Ρυθμιστική Αρχή Ενέργειας\n(4) Η Γενική Διεύθυνση Προστασίας Καταναλωτή"},{"n":47,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: πλήρους απασχόλησης, αορίστου χρόνου, ορισμένου χρόνου, μερικής απασχόλησης","q":"","text":"Αν μεταξύ εργαζομένου και εργοδότη συμφωνήθηκε ρητώς ή σιωπηρώς η συγκεκριμένη διάρκεια του χρόνου εργασίας ή αν κάτι τέτοιο προκύπτει από το είδος και τη φύση της εργασίας, τότε πρόκειται για Σύμβαση εργασίας (1) ____________________ .\n\nΣύμβαση εργασίας (2) ____________________ υπάρχει, όταν η χρονική διάρκειά της δεν καθορίζεται και δεν συνάγεται από το είδος και τον σκοπό της σύμβασης. Μπορεί δε να λήξει μόνο με καταγγελία από τον εργοδότη.\n\nΑν ένας εργαζόμενος δουλεύει με πλήρες ωράριο και για όλες τις εργάσιμες ημέρες της εβδομάδας, σύμφωνα με τη σχετική Συλλογική Σύμβαση Εργασίας, τότε η σύμβασή του θεωρείται (3) _________________.\n\nΜε τη Σύμβαση (4) _______________ καθορίζεται διάρκεια ημερήσιας ή εβδομαδιαίας ή δεκαπενθήμερης ή μηνιαίας εργασίας μικρότερη από την κανονική.","answer":"(1) ορισμένου χρόνου\n(2) αορίστου χρόνου\n(3) πλήρους απασχόλησης\n(4) μερικής απασχόλησης"},{"n":48,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: τους νόμους, την προσβολή, απαγορεύεται, την ελευθερία","q":"","text":"Το Σύνταγμα της Ελλάδας κατοχυρώνει (1) ____________________ του Τύπου.\n\nΗ κατάσχεση εφημερίδων πριν ή μετά την κυκλοφορία τους (2) ____________________.\n\nΟ καθένας είναι ελεύθερος να εκφράζει προφορικά ή γραπτά τις ιδέες του τηρώντας (3) ____________________ του Κράτους.\n\nΜια από τις περιπτώσεις που μπορεί να γίνει κατάσχεση εφημερίδων ή άλλων εντύπων μετά την κυκλοφορία τους είναι για (4) ____________________ της χριστιανικής ή άλλης γνωστής θρησκείας.","answer":"(1) την ελευθερία\n(2) απαγορεύεται\n(3) τους νόμους\n(4) την προσβολή"},{"n":49,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"Με βάση το Σύνταγμα της χώρας μας:","items":["1. Οι θρησκευτικές πεποιθήσεις κάποιου ενδέχεται να επηρεάσουν μέρος των ατομικών και πολιτικών δικαιωμάτων του","2. Για να είναι έγκυρος ένας γάμος μεταξύ ενηλίκων, πρέπει να έχουν συναινέσει οι γονείς/ κηδεμόνες τους.","3. Ο αθλητισμός τελεί υπό την προστασία και την ανώτατη εποπτεία του Κράτους.","4. H κατοικία κάθε πολίτη είναι άσυλο."],"answer":"1-Λ, 2-Λ, 3-Σ, 4-Σ"},{"n":50,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"Σε ποιες περιπτώσεις μπορεί κάποιος να αρνηθεί να πληρώσει διοικητικό πρόστιμο;","items":["1. Αν του επιβλήθηκε προφορικά από όργανο της δημόσιας τάξης (π.χ. δημοτική αστυνομία)","2. Αν έλαβε έγγραφη βεβαίωση προστίμου με ανεπαρκή αιτιολογία.","3. Αν δεν γνώριζε τον παράνομο χαρακτήρα της πράξης του.","4. Αν είχε λάβει διαβεβαίωση από αρμόδιο υπάλληλο ότι δεν απαιτείται να πληρώσει."],"answer":"1-Σ, 2-Σ, 3-Λ, 4-Λ"},{"n":51,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"Στην Ελλάδα:","items":["1. Η ενδοοικογενειακή βία είναι ένα έγκλημα που διώκεται αυτεπάγγελτα.","2. Ο βιασμός εντός του γάμου θεωρείται κακούργημα.","3. Η απλή σωματική βλάβη που μπορεί να προκαλέσει ένας άνδρας στην έγκυο σύζυγό του κατά την διάρκεια ενός τσακωμού, τιμωρείται με φυλάκιση.","4. Αν η γυναίκα κατά τη διάρκεια ενός τσακωμού προσβάλει την αξιοπρέπεια του συζύγου της μιλώντας του με ιδιαίτερα ταπεινωτικό λόγο ή έργο, που ανάγεται στη γενετήσια ζωή του, μπορεί να τιμωρηθεί με φυλάκιση."],"answer":"1-Σ, 2-Σ, 3-Σ, 4-Σ"},{"n":52,"type":"mcq","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"Η Συνθήκη Σένγκεν με την οποία θεσπίζεται μια Ευρώπη χωρίς εσωτερικά σύνορα («περιοχή Σένγκεν») δημιουργήθηκε από πέντε κράτη μέλη της Ε.Ε το έτος:","options":{"Α":"2023","Β":"1985","Γ":"2004.","Δ":"1957"},"answer":"Β"},{"n":53,"type":"mcq","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).","q":"Κατά το διάστημα που η Βουλή είναι ανοιχτή πόσες φορές την εβδομάδα απαντάει ο Πρωθυπουργός σε Επίκαιρες Ερωτήσεις (Ώρα του Πρωθυπουργού);","options":{"Α":"Μια φορά","Β":"Δύο φορές","Γ":"Καμία φορά","Δ":"Απεριόριστος αριθμός"},"answer":"Α"},{"n":54,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"Στην Ελλάδα η ελευθερία της Τέχνης προστατεύεται από το Σύνταγμα. Παρ' όλα αυτά σε ποιες περιπτώσεις θα μπορούσαν να επιβληθούν περιορισμοί στην καλλιτεχνική δημιουργία;","items":["1. Απαγόρευση εισόδου ανηλίκων σε κινηματογραφική αίθουσα, αν το έργο που προβάλλεται κρίνεται ως ακατάλληλο","2. Απαγόρευση κυκλοφορίας βιβλίου μυθοπλασίας, επειδή θεωρήθηκε από μερίδα πολιτών ότι προσβάλλει το θρησκευτικό τους αίσθημα","3. Απαγόρευση αυτοσχέδιας παράστασης σε κοινόχρηστο χώρο χωρίς να έχει ζητηθεί άδεια","4. Απαγόρευση δημιουργίας graffiti στους τοίχους ενός ξένου σπιτιού, χωρίς τη συναίνεση του ιδιοκτήτη"],"answer":"1-Σ, 2-Λ, 3-Σ, 4-Σ"},{"n":55,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"Στην Ελλάδα παρέχεται/παρέχονται δωρεάν από το κράτος:","items":["1. Η παιδεία, εξαιρουμένης της ανώτατης εκπαίδευσης","2. Οι μετακινήσεις με Μέσα Μαζικής Μεταφοράς σε άτομα με αναπηρία","3. Νοσηλευτική, διαγνωστική και φαρμακευτική κάλυψη σε ευάλωτες κοινωνικές ομάδες","4. Τα φάρμακα για όλους τους συνταξιούχους"],"answer":"1-Λ, 2-Σ, 3-Σ, 4-Λ"},{"n":56,"type":"open","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.","q":"","items":["1. Οι πολίτες χωρών της ΕΕ θεωρείται συνήθως πως έχουν ως φορολογική κατοικία τη χώρα όπου διαμένουν πάνω από 6 μήνες τον χρόνο","2. Σύμφωνα με τους κανόνες της ΕΕ, ένας Ευρωπαίος πολίτης που εργάζεται σε άλλο κράτος - μέλος από εκείνο που έχει υπηκοότητα, φορολογείται με άλλους όρους σε σχέση με τους υπηκόους της χώρας αυτής","3. Στην Ελλάδα τα ζευγάρια που έχουν τελέσει γάμο (θρησκευτικό, πολιτικό) ή σύμφωνο συμβίωσης οφείλουν να καταθέτουν κοινή φορολογική δήλωση","4. Στην καθημερινότητα, όταν κάποιος θέλει να αναφερθεί στη Δήλωση Φορολογίας Εισοδήματος, συνήθως κάνει λόγο για το «Ε1»"],"answer":"1-Σ, 2-Λ, 3-Λ, 4-Σ"},{"n":57,"type":"mcq","instr":"Γράψτε στο τετράδιό σας τον αριθμό του θέματος και δίπλα τη σωστή απάντηση σημειώνοντας το αντίστοιχο γράμμα (Α ή Β ή Γ ή Δ).","q":"Ποια από τις παρακάτω ενέργειες αποτελεί παράδειγμα κοινοβουλευτικού ελέγχου;","options":{"Α":"Η έκδοση ΚΥΑ","Β":"Η ψήφιση τροπολογίας σε νόμο","Γ":"Η αποχώρηση από τη Βουλή","Δ":"Η κατάθεση ερώτησης από βουλευτή ή βουλευτές προς την κυβέρνηση"} var KEY = 'pegp-institutions-v1';
var piles = {}, pile = 'live', queue = [], pos = 0, revealed = false, answered = null;

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d = JSON.parse(raw); piles = d.piles || {}; pile = d.pile || 'live'; }
  }catch(e){}
  CARDS.forEach(function(c){ if(!piles[c.n]) piles[c.n] = 'live'; });
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({piles:piles, pile:pile})); }catch(e){}
}
function counts(){
  var c = {live:0, known:0, almost:0, important:0};
  CARDS.forEach(function(x){ c[piles[x.n]]++; });
  return c;
}
function buildQueue(keepN){
  queue = CARDS.filter(function(c){ return piles[c.n] === pile; }).map(function(c){ return c.n; });
  pos = 0;
  if(keepN){ var i = queue.indexOf(keepN); if(i > -1) pos = i; }
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  var c = counts();
  document.getElementById('n-live').textContent = c.live;
  document.getElementById('n-known').textContent = c.known;
  document.getElementById('n-almost').textContent = c.almost;
  document.getElementById('n-important').textContent = c.important;
  [].forEach.call(document.querySelectorAll('.pile'), function(b){
    b.classList.toggle('sel', b.dataset.p === pile);
  });

  var box = document.getElementById('card');
  var showBtn = document.getElementById('show');
  var sorts = document.querySelector('.sorts');

  if(!queue.length){
    document.getElementById('counter').textContent = '0 / 0';
    box.innerHTML = '<div class="empty">Nothing in this pile.<br>Pick another pile above.</div>';
    showBtn.classList.add('hide');
    sorts.classList.add('hide');
    return;
  }
  if(pos >= queue.length) pos = queue.length - 1;
  var card = CARDS.filter(function(x){ return x.n === queue[pos]; })[0];
  document.getElementById('counter').textContent = (pos+1) + ' / ' + queue.length;

  var h = '<div class="qnum">Question ' + card.n + '</div>';
  h += '<div class="instr">' + esc(card.instr) + '</div>';
  if(card.q) h += '<div class="qtext">' + esc(card.q) + '</div>';

  if(card.type === 'mcq'){
    h += '<ul class="opts">';
    ['Α','Β','Γ','Δ'].forEach(function(k){
      var cls = 'opt';
      if(answered){
        cls += ' locked';
        if(k === card.answer) cls += ' correct';
        else if(k === answered) cls += ' wrong';
      }
      h += '<li class="' + cls + '" data-k="' + k + '"><span class="k">' + k + '.</span><span>' +
           esc(card.options[k]) + '</span></li>';
    });
    h += '</ul>';
    if(answered){
      var ok = answered === card.answer;
      h += '<div class="verdict ' + (ok ? 'ok">Correct' : 'no">Not quite — the answer is ' + card.answer) + '</div>';
    }
  } else {
    h += '<div class="body">';
    if(card.text) h += '<p>' + esc(card.text) + '</p>';
    if(card.items){
      h += '<ol class="items">';
      card.items.forEach(function(it){ h += '<li>' + esc(it) + '</li>'; });
      h += '</ol>';
    }
    if(card.pairs){
      h += '<table class="match"><tr><th>' + esc(card.heads[0]) + '</th><th>' + esc(card.heads[1]) + '</th></tr>';
      card.pairs.forEach(function(p){
        h += '<tr><td>' + esc(p[0]) + '</td><td>' + esc(p[1]) + '</td></tr>';
      });
      h += '</table>';
    }
    h += '</div>';
    if(revealed) h += '<div class="answer"><b>Answer</b>' + esc(card.answer) + '</div>';
  }
  box.innerHTML = h;

  if(card.type === 'mcq'){
    showBtn.classList.add('hide');
    if(!answered){
      [].forEach.call(box.querySelectorAll('.opt'), function(li){
        li.addEventListener('click', function(){ choose(card, li.dataset.k); });
      });
    }
  } else {
    showBtn.classList.remove('hide');
    showBtn.textContent = revealed ? 'Answer shown' : 'Show answer';
    showBtn.disabled = revealed;
    showBtn.style.opacity = revealed ? .45 : 1;
  }

  var done = (card.type === 'mcq') ? !!answered : revealed;
  sorts.classList.toggle('hide', !done);
  [].forEach.call(document.querySelectorAll('.sort'), function(b){
    b.classList.toggle('here', piles[card.n] === b.dataset.p);
  });
}

function choose(card, k){
  answered = k;
  piles[card.n] = (k === card.answer) ? 'known' : 'important';
  save();
  render();
}
function move(p){
  if(!queue.length) return;
  piles[queue[pos]] = p;
  save();
  render();
}
function go(d){
  if(!queue.length) return;
  pos = (pos + d + queue.length) % queue.length;
  revealed = false; answered = null;
  render();
}

document.getElementById('show').addEventListener('click', function(){ revealed = true; render(); });
document.getElementById('next').addEventListener('click', function(){ go(1); });
document.getElementById('back').addEventListener('click', function(){ go(-1); });
document.getElementById('shuffle').addEventListener('click', function(){
  for(var i = queue.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = queue[i]; queue[i] = queue[j]; queue[j] = t;
  }
  pos = 0; revealed = false; answered = null;
  render();
});
[].forEach.call(document.querySelectorAll('.pile'), function(b){
  b.addEventListener('click', function(){
    pile = b.dataset.p; revealed = false; answered = null;
    buildQueue(); save(); render();
  });
});
[].forEach.call(document.querySelectorAll('.sort'), function(b){
  b.addEventListener('click', function(){ move(b.dataset.p); });
});
document.getElementById('backup').addEventListener('click', function(){
  var data = {app:'pegp-institutions', saved:new Date().toISOString(), pile:pile, piles:piles};
  var txt = JSON.stringify(data);
  var stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  try{
    var url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    var a = document.createElement('a');
    a.href = url; a.download = 'institutions-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){
    prompt('Copy this backup text and keep it somewhere safe:', txt);
  }
});
document.getElementById('restore').addEventListener('click', function(){
  document.getElementById('restore-file').click();
});
document.getElementById('restore-file').addEventListener('change', function(ev){
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !d.piles) throw 0;
      var valid = {live:1, known:1, almost:1, important:1}, fresh = {}, n = 0;
      CARDS.forEach(function(c){
        var p = d.piles[c.n];
        fresh[c.n] = valid[p] ? p : 'live';
        if(fresh[c.n] !== 'live') n++;
      });
      if(!confirm('Restore this backup? ' + n + ' card(s) are sorted out of Live. Your current progress will be replaced.')) return;
      piles = fresh;
      pile = valid[d.pile] ? d.pile : 'live';
      revealed = false; answered = null;
      save(); buildQueue(); render();
    }catch(e){ alert('That file is not a valid backup.'); }
  };
  r.readAsText(f);
});
document.getElementById('reset').addEventListener('click', function(){
  if(!confirm('Reset all cards back to Live?')) return;
  CARDS.forEach(function(c){ piles[c.n] = 'live'; });
  pile = 'live'; revealed = false; answered = null;
  save(); buildQueue(); render();
});

load(); buildQueue(); render();
</script>
<script>
(function(){
  var N=80, inp=document.getElementById('gotoN'), msg=document.getElementById('gotoMsg');
  function jumpTo(v){ pile=piles[v]; revealed=false; answered=null; buildQueue(v); save(); render(); return pile.charAt(0).toUpperCase()+pile.slice(1); }
  function go(){
    var v=parseInt(inp.value,10);
    if(!(v>=1&&v<=N)){ msg.textContent='Enter a number from 1 to '+N; return; }
    var name=jumpTo(v);
    msg.textContent='Question '+v+' — in '+name;
    inp.value=''; inp.blur(); window.scrollTo(0,0);
  }
  document.getElementById('gotoBtn').addEventListener('click',go);
  inp.addEventListener('keydown',function(e){ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); go(); } });
  inp.addEventListener('input',function(){ msg.textContent=''; });
})();
</script>
